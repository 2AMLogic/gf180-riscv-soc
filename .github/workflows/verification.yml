name: verification

# The verification gate: the commands live once in scripts/check.sh, and each
# job calls it. The jobs keep only CI-only setup: the apt tool installs, the
# sv2v download from the release tagged PIN_SV2V (parsed from
# scripts/setup-env.sh, like the smoke job's PIN_COCOTB), the pinned cocotb
# venv, and the CVE2 fetch/convert the RTL lint needs (which also needs
# iverilog as well as verilator). iverilog comes from the distro and may not
# be the pinned version (spec/stamped-harness-decision.md). No path filters.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stamped:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stamped files match reuse.lock.json
        run: scripts/check.sh stamped

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator and Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y verilator iverilog
      - name: Install sv2v at the pinned version
        run: |
          pin="$(sed -n 's/^PIN_SV2V="\([^"]*\)".*/\1/p' scripts/setup-env.sh)"
          test -n "$pin"
          curl -fsSL -o /tmp/sv2v.zip "https://github.com/zachjs/sv2v/releases/download/${pin}/sv2v-Linux.zip"
          unzip -q -o /tmp/sv2v.zip -d /tmp/sv2v
          sudo install -m 0755 /tmp/sv2v/sv2v-Linux/sv2v /usr/local/bin/sv2v
          sv2v --version
      - name: Fetch and convert the CVE2 core
        run: |
          scripts/fetch-cve2.sh
          scripts/convert-cve2.sh
      - name: Record linter, fixture tests and RTL lint
        run: scripts/check.sh lint

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install cocotb at the pinned version
        run: |
          pin="$(sed -n 's/^PIN_COCOTB="\([^"]*\)".*/\1/p' scripts/setup-env.sh)"
          test -n "$pin"
          python3 -m venv .venv
          .venv/bin/pip install "cocotb==${pin}"
      - name: cocotb smoke
        run: scripts/check.sh smoke
